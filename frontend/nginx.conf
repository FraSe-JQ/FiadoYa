map $http_x_forwarded_proto $proxy_scheme {
 default $scheme;
 https https;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $backend http://backend:8080;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 location /api/ { proxy_pass $backend$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $proxy_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location /swagger-ui/ { proxy_pass $backend$request_uri; }
 location /v3/ { proxy_pass $backend$request_uri; }
 location / { try_files $uri $uri/ /index.html; }
}
